name: CI - Playwright Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ci-pages"
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Playwright needs browser binaries on the runner
      - name: Install Playwright browsers (Chromium)
        run: mvn -B exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install chromium"

      - name: Run tests
        run: mvn -B clean test

      # Keep raw results for debugging (even if tests fail)
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      # Only publish the HTML report from main branch runs (clean + professional)
      - name: Set up Node.js (for Allure CLI)
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Allure CLI
        if: always() && github.ref == 'refs/heads/main'
        run: npm i -g allure-commandline

      - name: Generate Allure HTML report
        if: always() && github.ref == 'refs/heads/main'
        run: allure generate target/allure-results --clean -o allure-report

      - name: Configure GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4